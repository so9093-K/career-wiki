<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">fNIRS PET prediction research flow</title><desc id="desc">Preprocessed fNIRS signals are analyzed, modeled, explained and independently validated for PET positivity prediction.</desc><rect width="1200" height="675" fill="#f6f8fa"/><rect x="44" y="44" width="1112" height="587" rx="28" fill="#fff" stroke="#c8d0d8" stroke-width="2"/><g font-family="NanumBarunGothic,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="82" y="105" font-size="23" font-weight="700" fill="#80652e">fNIRS → PET PREDICTION</text><text x="82" y="139" font-size="16" fill="#59636e">signal analysis → modeling → explanation → validation</text><rect x="82" y="215" width="224" height="220" rx="18" fill="#eef1f4" stroke="#c8d0d8"/><text x="108" y="258" font-size="17" font-weight="700" fill="#1f2328">Preprocessed fNIRS</text><path d="M108 342c30-34 50 28 80-8s50 22 82-10" fill="none" stroke="#80652e" stroke-width="4" stroke-linecap="round"/><path d="M108 375c28 24 52-25 80 5s53-18 82 7" fill="none" stroke="#8c959f" stroke-width="3" stroke-linecap="round"/><text x="108" y="410" font-size="13" fill="#59636e">olfactory stimulus response</text><path d="M322 325H381" stroke="#8c959f" stroke-width="2.5"/><path d="M372 317l10 8-10 8" fill="none" stroke="#8c959f" stroke-width="2.5"/><rect x="396" y="226" width="190" height="198" rx="18" fill="#fff" stroke="#c8d0d8"/><text x="424" y="268" font-size="17" font-weight="700" fill="#1f2328">EDA + Features</text><text x="424" y="307" font-size="14" fill="#59636e">group response</text><text x="424" y="336" font-size="14" fill="#59636e">input window</text><text x="424" y="365" font-size="14" fill="#59636e">feature structure</text><path d="M600 325H659" stroke="#8c959f" stroke-width="2.5"/><path d="M650 317l10 8-10 8" fill="none" stroke="#8c959f" stroke-width="2.5"/><rect x="674" y="204" width="188" height="242" rx="18" fill="#eee8dc" stroke="#c9b98f"/><text x="704" y="248" font-size="17" font-weight="700" fill="#1f2328">Modeling</text><rect x="704" y="279" width="128" height="40" rx="9" fill="#fff" stroke="#c8d0d8"/><text x="731" y="305" font-size="14" font-weight="700" fill="#3d444d">LSTM-FCN</text><rect x="704" y="332" width="128" height="40" rx="9" fill="#fff" stroke="#c8d0d8"/><text x="737" y="358" font-size="14" font-weight="700" fill="#3d444d">Optuna</text><text x="704" y="404" font-size="13" fill="#80652e">PET positive probability</text><path d="M876 325H935" stroke="#8c959f" stroke-width="2.5"/><path d="M926 317l10 8-10 8" fill="none" stroke="#8c959f" stroke-width="2.5"/><rect x="950" y="225" width="166" height="200" rx="18" fill="#fff" stroke="#c8d0d8"/><text x="978" y="267" font-size="17" font-weight="700" fill="#1f2328">Validation</text><text x="978" y="307" font-size="14" fill="#59636e">XAI</text><text x="978" y="336" font-size="14" fill="#59636e">Stratified CV</text><text x="978" y="365" font-size="14" fill="#59636e">Independent Test</text><path d="M1034 441v60H844" stroke="#8c959f" stroke-width="2.5" fill="none"/><path d="M853 493l-10 8 10 8" fill="none" stroke="#8c959f" stroke-width="2.5"/><rect x="603" y="486" width="238" height="88" rx="16" fill="#2d333b"/><text x="638" y="526" font-size="17" font-weight="700" fill="#f6f8fa">Clinical Evaluation</text><text x="638" y="553" font-size="13" fill="#cdd9e5">generalization + evidence</text></g></svg>