<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ECG·PPG 기반 혈압 설명 및 예측 분석</title>
  <desc id="desc">ECG와 PPG 신호의 상대 시간 지연, 절대 혈압 예측의 극단 구간 오차 증가, MBP 고위험 상태 보조 선별 결과를 담백하게 정리한 프로젝트 커버.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#26323c" stroke-width="1" opacity="0.24"/>
    </pattern>
    <style>
      .ko{font-family:'NanumSquare','Noto Sans KR','Apple SD Gothic Neo',Arial,sans-serif}
      .title{font-size:42px;font-weight:700;fill:#eef2f5}
      .subtitle{font-size:22px;font-weight:400;fill:#a9b2ba}
      .section{font-size:25px;font-weight:700;fill:#e8edf1}
      .label{font-size:20px;font-weight:600;fill:#dbe1e6}
      .small{font-size:15px;font-weight:400;fill:#a2adb6}
      .metric{font-size:23px;font-weight:700;fill:#e8edf1}
      .accent{fill:#e0b55f}
