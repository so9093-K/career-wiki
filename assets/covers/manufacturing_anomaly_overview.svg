<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">제조 공정 시계열 이상징후 조기탐지</title>
<desc id="desc">주요 센서 시계열에서 사전 이상 구간의 미세한 변화를 보여주고, SOH 전환 이후 재구성 오차가 임계값을 넘어 이상 후보로 이어지는 제조 AI 조기탐지 커버.</desc>
